# 敏感配置（生产用 sealed-secrets / 外部 KMS 管理，此处为示例）
# JWT_SECRET 必须 ≥32 字节；生成：python3 -c "import secrets; print(secrets.token_hex(32))"
apiVersion: v1
kind: Secret
metadata:
  name: or-scheduling-secret
  namespace: or-scheduling
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_RANDOM_64_HEX_CHARS_AT_LEAST_32_BYTES"
