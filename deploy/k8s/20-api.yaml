# API 无状态服务：可水平扩展（SSE 四段式使 API 无状态）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: or-scheduling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: or-scheduling-api:latest  # 替换为实际镜像仓库地址
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: or-scheduling-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: or-scheduling-secret
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: or-scheduling
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: or-scheduling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
