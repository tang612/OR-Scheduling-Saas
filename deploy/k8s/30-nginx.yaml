# Nginx：TLS 终结 + 静态托管 + API 反代；Ingress 暴露
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: or-scheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: frontend-dist
              mountPath: /usr/share/nginx/html
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: frontend-dist
          emptyDir: {}  # 生产由 CI 将 dist 注入，此处示例
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: or-scheduling
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
# TLS 由 Ingress 终结（证书用 cert-manager 或云 LB）；nginx 容器内 80 已够
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: or-scheduling
  namespace: or-scheduling
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - or-scheduling.example.com
      secretName: or-scheduling-tls
  rules:
    - host: or-scheduling.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
