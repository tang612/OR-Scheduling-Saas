events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;      # 关键：缺了它 .js/.css 会以 text/plain 返回，浏览器拒绝执行模块脚本 → 白屏
    default_type application/octet-stream;

    # Docker 内嵌 DNS：配合下方变量化 proxy_pass，每次请求动态解析 api 容器 IP。
    # 否则 api 容器重建（recreate）后 IP 变化，nginx 仍缓存旧 IP → 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP（宿主映射 8080）：直接服务，本地/内网访问零摩擦
    server {
        listen 80;
        server_name _;

        set $api api:8000;

        # 存活探针
        location = /healthz {
            proxy_pass http://$api/healthz;
        }

        # 就绪探针（依赖检查）
        location = /readyz {
            proxy_pass http://$api/readyz;
        }

        # Prometheus 指标
        location = /metrics {
            proxy_pass http://$api/metrics;
        }

        # API 反代（SSE 实时进度）
        location /api/ {
            proxy_pass http://$api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 关键配置
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # 前端静态（React build 产物）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS（宿主映射 8443，自签）：TLS 终结在 nginx，后端仍走 http
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        set $api api:8000;

        # 存活探针
        location = /healthz {
            proxy_pass http://$api/healthz;
        }

        # 就绪探针（依赖检查）
        location = /readyz {
            proxy_pass http://$api/readyz;
        }

        # Prometheus 指标
        location = /metrics {
            proxy_pass http://$api/metrics;
        }

        # API 反代（SSE 实时进度）
        location /api/ {
            proxy_pass http://$api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 关键配置
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # 前端静态（React build 产物）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
